[package]
name = "game-hub-widget"
version = "1.1.0"
description = "Le Hub de jeux personnalisable de tes rêves"
authors = ["geewerrr"]
edition = "2021"

[build-dependencies]
# On force la version 2.0 ou supérieure
tauri-build = { version = "^2.0.0", features = [] }

[dependencies]
tauri = { version = "^2.0.0", features = ["protocol-asset"] } # protocol-asset : affiche les images locales (jaquettes perso, cache Steam)
tauri-build = { version = "^2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
opener = "0.7"
glob = "0.3"
regex = "1"
ureq = { version = "2.9", features = ["json"] }
urlencoding = "2"
tauri-plugin-dialog = "2" # Pour choisir les fichiers
tauri-plugin-single-instance = "2" # Une seule fenêtre même si on relance l'app
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
# Même version que celle tirée par tauri : pas de seconde compilation. Sert à la StartupTask MSIX.
windows = { version = "0.61", features = ["ApplicationModel", "Foundation", "Win32_System_Com"] }
